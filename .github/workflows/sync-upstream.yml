name: Sync fork with upstream

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC hàng ngày
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync master with chatfire-AI/huobao-drama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }} --source chatfire-AI/huobao-drama --branch master
